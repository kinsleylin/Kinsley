<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校園月刊書牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --wall-1:#eee3c8;
    --wall-2:#e6d7b4;
    --wood-dark:#3d2415;
    --wood-mid:#6b3f22;
    --wood-light:#8a5a35;
    --wood-edge:#2a1509;
    --gold:#b6893f;
    --gold-light:#d8b46a;
    --ink:#2b2013;
    --ink-soft:#5a4a34;
    --paper:#f6efdc;
    --shadow:rgba(30,18,8,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,250,230,.25), transparent 60%),
      repeating-linear-gradient(180deg, var(--wall-1) 0px, var(--wall-2) 3px, var(--wall-1) 6px);
    font-family:"Noto Sans TC", sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:64px;
    overflow-x:hidden;
  }

  /* ---------- 招牌 ---------- */
  .signboard{
    margin-top:46px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .chains{
    display:flex;
    gap:120px;
    margin-bottom:-2px;
  }
  .chains span{
    display:block;
    width:2px;
    height:28px;
    background:linear-gradient(180deg,var(--gold-light),var(--wood-dark));
  }
  .plaque{
    background:linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    border:2px solid var(--gold);
    border-radius:6px;
    padding:16px 44px 18px;
    text-align:center;
    box-shadow:0 10px 22px var(--shadow);
    position:relative;
  }
  .plaque::before,.plaque::after{
    content:"";
    position:absolute;
    top:8px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 70%);
  }
  .plaque::before{left:8px;}
  .plaque::after{right:8px;}
  .plaque .eyebrow{
    display:block;
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    letter-spacing:.14em;
    font-size:13px;
    color:var(--gold-light);
    margin-bottom:2px;
  }
  .plaque h1{
    margin:0;
    font-family:"Noto Serif TC", serif;
    font-weight:900;
    font-size:30px;
    letter-spacing:.06em;
    color:var(--paper);
    text-shadow:0 1px 0 rgba(0,0,0,.4);
  }

  .intro{
    max-width:520px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.9;
    margin:22px 18px 8px;
  }

  /* ---------- 書牆主體 ---------- */
  .wall{
    width:100%;
    max-width:980px;
    padding:36px 24px 0;
  }

  .shelf{
    position:relative;
    margin-bottom:46px;
  }

  .spines{
    position:relative;
    z-index:2;
    display:flex;
    align-items:flex-end;
    gap:18px;
    padding:0 22px 0;
    min-height:236px;
  }

  .plank{
    height:26px;
    background:linear-gradient(180deg, var(--wood-light) 0%, var(--wood-mid) 55%, var(--wood-dark) 100%);
    border-radius:3px;
    box-shadow:
      0 8px 0 rgba(0,0,0,.06) inset,
      0 14px 18px var(--shadow);
    position:relative;
  }
  .plank::after{
    content:"";
    position:absolute;
    left:14px;right:14px;top:5px;height:2px;
    background:rgba(255,255,255,.12);
    border-radius:2px;
  }
  .bracket{
    position:absolute;
    bottom:-18px;
    width:14px;
    height:22px;
    background:var(--wood-edge);
    border-radius:0 0 4px 4px;
  }
  .bracket.left{left:26px;}
  .bracket.right{right:26px;}

  /* 書背卡片 */
  .book{
    position:relative;
    width:118px;
    height:210px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .book .spine-face{
    position:absolute;
    inset:0;
    border-radius:4px 4px 2px 2px;
    background:linear-gradient(100deg, #8a4a2c 0%, #6e3520 45%, #562615 100%);
    box-shadow:
      inset 2px 0 0 rgba(255,255,255,.14),
      inset -3px 0 6px rgba(0,0,0,.35),
      0 10px 14px var(--shadow);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:14px 0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.2), box-shadow .45s ease;
    transform-origin:bottom center;
  }
  .book .band{
    width:70%;
    height:3px;
    background:var(--gold);
    opacity:.85;
  }
  .book .spine-title{
    writing-mode:vertical-rl;
    font-family:"Noto Serif TC", serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:.16em;
    color:var(--paper);
  }
  .book .spine-issue{
    writing-mode:vertical-rl;
    font-family:"Noto Sans TC", sans-serif;
    font-size:11px;
    color:var(--gold-light);
    letter-spacing:.08em;
  }

  .book .cover-reveal{
    position:absolute;
    left:50%;
    bottom:8px;
    width:150px;
    transform:translate(-50%, 6px) rotate(0deg) scale(.94);
    opacity:0;
    pointer-events:none;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .35s ease;
    z-index:3;
  }
  .book .cover-reveal .cover-card{
    background:var(--paper);
    border:1px solid var(--gold);
    border-radius:5px;
    padding:6px;
    box-shadow:0 20px 28px var(--shadow);
  }
  .book .cover-reveal img{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
    background:#ddd;
  }
  .book .cover-reveal .cap{
    margin-top:6px;
    text-align:center;
    font-size:12px;
    color:var(--ink);
    font-weight:500;
  }
  .book .cover-reveal .cap small{
    display:block;
    color:var(--ink-soft);
    font-size:10px;
    margin-top:1px;
  }

  .book:hover .spine-face, .book:focus-visible .spine-face{
    transform:translateY(-34px) rotate(-3deg);
    box-shadow:
      inset 2px 0 0 rgba(255,255,255,.14),
      inset -3px 0 6px rgba(0,0,0,.35),
      0 30px 26px var(--shadow);
  }
  .book:hover .cover-reveal, .book:focus-visible .cover-reveal{
    opacity:1;
    transform:translate(-50%, -78px) rotate(-3deg) scale(1);
  }

  /* 預留空位 */
  .ghost{
    width:118px;
    height:172px;
    align-self:flex-end;
    border:1.5px dashed rgba(61,36,21,.35);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(61,36,21,.4);
  }
  .ghost span{
    writing-mode:vertical-rl;
    font-size:12px;
    letter-spacing:.2em;
  }

  footer{
    margin-top:8px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    opacity:.75;
  }

  @media (max-width:600px){
    .plaque{padding:12px 26px 14px;}
    .plaque h1{font-size:22px;}
    .chains{gap:70px;}
    .spines{gap:12px; padding:0 14px;}
    .book, .ghost{width:88px;}
    .book{height:172px;}
    .ghost{height:140px;}
    .book .cover-reveal{width:112px;}
    .book:hover .cover-reveal, .book:focus-visible .cover-reveal{transform:translate(-50%, -60px) rotate(-3deg) scale(1);}
  }
</style>
</head>
<body>

  <div class="signboard">
    <div class="chains"><span></span><span></span></div>
    <div class="plaque">
      <span class="eyebrow">Monthly Archive</span>
      <h1>校園月刊書牆</h1>
    </div>
  </div>

  <p class="intro">把每一期月刊放上書架，像走進圖書館一樣輕輕一抽，就能翻開閱讀。點選書背即可開啟線上翻頁月刊。</p>

  <main class="wall">
    <div class="shelf">
      <div class="spines" id="shelf-spines"></div>
      <div class="plank">
        <div class="bracket left"></div>
        <div class="bracket right"></div>
      </div>
    </div>
  </main>

  <footer>敬請期待更多期月刊陸續上架</footer>

<script>
/* =========================================================
   月刊資料清單 — 之後要新增月刊，只要在下面複製一組 { } 貼上，
   並填入該期的標題、期別、封面圖片與連結網址即可。
   ========================================================= */
const ISSUES = [
  {
    title: "國際處月報",
    issue: "2026年4月號",
    cover: "https://online.flipbuilder.com/ESLibrary/pqjf/files/shot.png",
    url: "https://online.flipbuilder.com/ESLibrary/pqjf/"
  },
  {
    title: "國際處月報",
    issue: "2026年5月號",
    cover: "https://online.flipbuilder.com/ESLibrary/star/files/shot.png",
    url: "https://online.flipbuilder.com/ESLibrary/star/"
  },
  {
    title: "國際處月報",
    issue: "2026年6月號",
    cover: "https://online.flipbuilder.com/ESLibrary/njfx/files/shot.png",
    url: "https://online.flipbuilder.com/ESLibrary/njfx/"
  }
  /* 範例：新增下一期時，複製這一組貼在上面那組後面（記得中間加逗號）
  ,{
    title: "國際處月報",
    issue: "2026年7月號",
    cover: "圖片網址",
    url: "翻頁月刊網址"
  }
  */
];

// 一排書架最多顯示幾個位置(含尚未使用的預留位)
const SHELF_CAPACITY = 6;

const shelfEl = document.getElementById('shelf-spines');

ISSUES.forEach(item => {
  const book = document.createElement('a');
  book.className = 'book';
  book.href = item.url;
  book.target = '_blank';
  book.rel = 'noopener noreferrer';
  book.setAttribute('aria-label', item.title + ' ' + item.issue);
  book.style.textDecoration = 'none';
  book.innerHTML = `
    <div class="spine-face">
      <div class="band"></div>
      <div class="spine-title">${item.title}</div>
      <div class="spine-issue">${item.issue}</div>
      <div class="band"></div>
    </div>
    <div class="cover-reveal">
      <div class="cover-card">
        <img src="${item.cover}" alt="${item.title} ${item.issue} 封面" loading="lazy">
        <div class="cap">${item.title}<small>${item.issue}</small></div>
      </div>
    </div>
  `;
  shelfEl.appendChild(book);
});

const ghostCount = Math.max(0, SHELF_CAPACITY - ISSUES.length);
for (let i = 0; i < ghostCount; i++){
  const ghost = document.createElement('div');
  ghost.className = 'ghost';
  ghost.innerHTML = '<span>敬請期待</span>';
  shelfEl.appendChild(ghost);
}
</script>
</body>
</html>
