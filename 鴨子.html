<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>學習小鴨池</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

:root {
  --paper: #F7F2E9;
  --card: #FFFDF8;
  --ink: #3B362E;
  --ink-soft: #6B6255;
  --line: #E6DDC9;
  --gold: #C99A44;
  --gold-soft: #E9D3A0;
  --pond: #5C8A83;
  --terracotta: #BE6248;
  --sage: #8A9A5B;
  --plum: #6B5B7B;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Work Sans', sans-serif;
  background: var(--paper);
  background-image: radial-gradient(circle at 15% 8%, rgba(201,154,68,0.07), transparent 40%),
                     radial-gradient(circle at 85% 92%, rgba(92,138,131,0.07), transparent 45%);
  color: var(--ink);
  min-height: 100vh;
}
#app { padding: 32px 24px 60px; max-width: 1080px; margin: 0 auto; }

h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }

/* ---------- header ---------- */
.duck-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 18px; margin-bottom: 28px;
  padding-bottom: 20px; border-bottom: 1px solid var(--line);
}
.duck-header-left { display: flex; align-items: center; gap: 14px; }
.duck-header-left h1 { font-size: 28px; color: var(--ink); }
.duck-sub { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em; }

.duck-tabs { display: flex; gap: 4px; }
.duck-tabs button {
  border: none; background: transparent; padding: 9px 18px;
  border-radius: 999px; font-family: 'Work Sans'; font-weight: 600;
  color: var(--ink-soft); cursor: pointer; font-size: 14px;
  transition: background 0.25s ease, color 0.25s ease;
}
.duck-tabs button.active { background: var(--ink); color: var(--paper); }
.duck-tabs button:hover:not(.active) { background: var(--line); color: var(--ink); }

/* ---------- layout ---------- */
.duck-main { display: flex; flex-direction: column; gap: 24px; }
.tab-panel { display: none; flex-direction: column; gap: 24px; animation: fadeIn 0.35s ease; }
.tab-panel.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

.card {
  background: var(--card); border-radius: 18px; padding: 24px 28px;
  border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(59,54,46,0.05);
}

/* ---------- pond / streak ---------- */
.pond-card-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
.pond-card-title h3 { font-size: 19px; }
.pond-sub { font-size: 12px; color: var(--ink-soft); }
.pond-row { display: flex; gap: 10px; overflow-x: auto; padding: 36px 4px 6px; }
.lily-wrap { position: relative; flex-shrink: 0; }
.lily-duck { position: absolute; top: -30px; left: 2px; }

/* ---------- stat row ---------- */
.stat-row { display: flex; gap: 18px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 150px; text-align: left; }
.stat-num { display: block; font-family: 'Fraunces', serif; font-size: 32px; color: var(--terracotta); font-variant-numeric: tabular-nums; }
.stat-label { font-size: 12.5px; color: var(--ink-soft); }

/* ---------- goals ---------- */
.goals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.goals-header h3 { font-size: 19px; }
.link-btn { background: none; border: none; color: var(--pond); font-family: 'Work Sans'; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.goal-bars { display: flex; flex-direction: column; gap: 14px; }
.goal-row { display: flex; align-items: center; gap: 12px; }
.goal-label { width: 88px; font-size: 13px; font-weight: 600; color: var(--ink); flex-shrink: 0; }
.goal-track { flex: 1; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.goal-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
.goal-value { width: 90px; text-align: right; font-size: 12px; color: var(--ink-soft); flex-shrink: 0; font-variant-numeric: tabular-nums; }

.toeic-card { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; background: linear-gradient(135deg, #6B5B7B, #83719A); color: #F7F2E9; }
.toeic-card h3 { color: #F7F2E9; font-size: 18px; }
.toeic-left p { margin: 4px 0 0; font-size: 13px; color: #E3DAF0; }
.toeic-right { text-align: right; }
.toeic-days { font-family: 'Fraunces'; font-size: 34px; font-variant-numeric: tabular-nums; }
.toeic-days-label { font-size: 12px; color: #E3DAF0; }

/* ---------- charts ---------- */
.charts-row { display: flex; gap: 18px; flex-wrap: wrap; }
.chart-card { flex: 1; min-width: 280px; }
.chart-card h3 { font-size: 16px; margin-bottom: 12px; }
.chart-card canvas { max-height: 220px; }

/* ---------- suggestions ---------- */
.suggest-card { background: #FBF6EA; border-color: var(--gold-soft); }
.suggest-title { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces'; color: #8A6A26; margin-bottom: 10px; font-size: 17px; }
.suggest-card ul { margin: 0; padding-left: 20px; }
.suggest-card li { margin-bottom: 7px; font-size: 14px; color: #6B5426; line-height: 1.5; }

/* ---------- daily word ---------- */
.word-card { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.word-main { flex: 1; min-width: 220px; }
.word-eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--ink-soft); text-transform: uppercase; }
.word-title { font-size: 30px; margin: 6px 0 8px; color: var(--ink); }
.word-pos { font-size: 12px; color: var(--pond); font-weight: 600; margin-right: 8px; }
.word-meaning { font-size: 15px; color: var(--ink); margin: 6px 0; }
.word-example { font-size: 14px; color: var(--ink-soft); font-style: italic; margin: 10px 0 4px; line-height: 1.55; }
.word-example-zh { font-size: 13px; color: var(--ink-soft); margin: 0; }
.word-actions { display: flex; flex-direction: column; gap: 8px; }

/* ---------- buttons ---------- */
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--terracotta); color: #FFF9F2; border: none; padding: 11px 20px;
  border-radius: 999px; font-family: 'Work Sans'; font-weight: 700;
  cursor: pointer; font-size: 14px; align-self: flex-start;
  box-shadow: 0 6px 16px rgba(190,98,72,0.28);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(190,98,72,0.35); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-ghost {
  background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
  padding: 10px 18px; border-radius: 999px; font-family: 'Work Sans'; font-weight: 600; cursor: pointer;
}
.btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

/* ---------- lists ---------- */
.entry-list, .explore-list { display: flex; flex-direction: column; gap: 12px; }
.empty-hint { color: var(--ink-soft); font-size: 14px; }

.entry-item, .explore-item { padding: 16px 20px; }
.entry-item-top { display: flex; align-items: center; gap: 10px; }
.entry-date { font-weight: 700; font-family: 'Fraunces'; color: var(--ink); }
.entry-minutes { color: var(--ink-soft); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
.entry-delete { background: none; border: none; color: var(--terracotta); cursor: pointer; padding: 4px; font-size: 15px; opacity: 0.7; }
.entry-delete:hover { opacity: 1; }
.entry-skills { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
.skill-chip { color: #FFF9F2; font-size: 11.5px; padding: 4px 11px; border-radius: 999px; font-weight: 600; letter-spacing: 0.01em; }
.entry-note { font-size: 14px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.5; }
.entry-vocab { font-size: 12.5px; color: var(--gold); font-weight: 600; margin: 6px 0 0; }

.explore-intro { color: var(--ink-soft); font-size: 14px; margin: 0; }
.explore-item-top { display: flex; justify-content: space-between; align-items: center; }
.explore-item h4 { margin: 10px 0 4px; font-size: 16px; }
.explore-item p { margin: 0; font-size: 13px; color: var(--ink-soft); }

/* ---------- forms ---------- */
.duck-form { display: flex; flex-direction: column; gap: 14px; animation: fadeIn 0.3s ease; }
.duck-form.hidden { display: none; }
.duck-form-header { display: flex; justify-content: space-between; align-items: center; }
.duck-form-header h3 { font-size: 18px; }
.duck-form-header button { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 16px; }
.duck-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
.duck-form input, .duck-form textarea {
  font-family: 'Work Sans'; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px; font-size: 14px; color: var(--ink); resize: vertical; background: #FFFEFB;
}
.duck-form input:focus, .duck-form textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,154,68,0.15); }
.chip-select { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-option {
  border: 1px solid var(--line); background: #FFFEFB; padding: 7px 15px;
  border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--ink-soft); font-weight: 600;
  transition: all 0.15s ease;
}
.chip-option.selected { color: #FFF9F2; border-color: transparent; }
.duck-form-actions { display: flex; gap: 10px; }
.form-hint { font-size: 12px; color: var(--terracotta); margin: 0; }
.duck-save-warning {
  background: #F7E3D9; color: #8A4B14; padding: 10px 16px;
  border-radius: 12px; margin-bottom: 16px; font-size: 13px; display: none;
}
.goal-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

@media (max-width: 640px) {
  .duck-header { flex-direction: column; align-items: flex-start; }
  .duck-tabs { width: 100%; overflow-x: auto; }
  .goal-form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <div class="duck-save-warning" id="saveWarning">資料儲存暫時失敗，請確認瀏覽器允許本機儲存（localStorage）。</div>

  <header class="duck-header">
    <div class="duck-header-left">
      <span id="mascotHeader"></span>
      <div>
        <h1>學習小鴨池</h1>
        <p class="duck-sub">英文學習追蹤儀表板</p>
      </div>
    </div>
    <nav class="duck-tabs">
      <button data-tab="dashboard" class="active">總覽</button>
      <button data-tab="log">學習紀錄</button>
      <button data-tab="explore">探索清單</button>
    </nav>
  </header>

  <main class="duck-main">

    <section id="panel-dashboard" class="tab-panel active">

      <div class="card word-card" id="wordCard"></div>

      <div class="card">
        <div class="pond-card-title">
          <h3 id="streakText">連續學習 0 天</h3>
          <span class="pond-sub">最近 14 天足跡</span>
        </div>
        <div class="pond-row" id="pondRow"></div>
      </div>

      <div class="stat-row">
        <div class="card stat-card">
          <span class="stat-num" id="statWeekMinutes">0</span>
          <span class="stat-label">本週學習分鐘</span>
        </div>
        <div class="card stat-card">
          <span class="stat-num" id="statEntryCount">0</span>
          <span class="stat-label">累積紀錄筆數</span>
        </div>
        <div class="card stat-card">
          <span class="stat-num" id="statVocabCount">0</span>
          <span class="stat-label">累積背誦單字</span>
        </div>
      </div>

      <div class="card">
        <div class="goals-header">
          <h3>本週目標進度</h3>
          <button class="link-btn" id="openGoalForm">編輯目標</button>
        </div>
        <div class="goal-bars" id="goalBars"></div>
      </div>

      <div class="duck-form hidden card" id="goalForm">
        <div class="duck-form-header">
          <h3>編輯本週目標</h3>
          <button id="closeGoalForm">✕</button>
        </div>
        <div class="goal-form-grid" id="goalFormFields"></div>
        <label>多益目標分數
          <input type="number" id="goalToeicScore" min="10" max="990" step="5" />
        </label>
        <label>預計應考日期
          <input type="date" id="goalToeicDate" />
        </label>
        <div class="duck-form-actions">
          <button class="btn-primary" id="submitGoals">儲存目標</button>
          <button class="btn-ghost" id="cancelGoals">取消</button>
        </div>
      </div>

      <div class="card toeic-card" id="toeicCard"></div>

      <div class="charts-row">
        <div class="card chart-card">
          <h3>本週各技能練習分鐘</h3>
          <canvas id="skillChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>近 14 天每日時數</h3>
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <div class="card suggest-card">
        <div class="suggest-title">✦ <span>小鴨的建議</span></div>
        <ul id="suggestList"></ul>
      </div>
    </section>

    <section id="panel-log" class="tab-panel">
      <button class="btn-primary" id="openEntryForm">＋ 新增學習紀錄</button>

      <div class="duck-form hidden card" id="entryForm">
        <div class="duck-form-header">
          <h3>新增學習紀錄</h3>
          <button id="closeEntryForm">✕</button>
        </div>
        <label>日期
          <input type="date" id="entryDate" />
        </label>
        <label>技能類別（可複選）
          <div class="chip-select" id="entrySkillChips"></div>
        </label>
        <label>花費時間（分鐘）
          <input type="number" id="entryMinutes" min="1" value="20" />
        </label>
        <label id="vocabCountWrap" style="display:none;">單字量（背了幾個單字）
          <input type="number" id="entryVocabCount" min="0" value="0" />
        </label>
        <label>內容 / 心得
          <textarea id="entryNote" rows="3" placeholder="例如：聽了 EP12 的 Podcast，精聽兩遍"></textarea>
        </label>
        <div class="duck-form-actions">
          <button class="btn-primary" id="submitEntry">儲存</button>
          <button class="btn-ghost" id="cancelEntry">取消</button>
        </div>
        <p class="form-hint" id="entryHint" style="display:none;">請至少選一個技能類別</p>
      </div>

      <div class="entry-list" id="entryList"></div>
    </section>

    <section id="panel-explore" class="tab-panel">
      <p class="explore-intro">還沒決定要用哪個資源？先放進這裡，等真的開始練習了，再到「學習紀錄」正式打卡。</p>
      <button class="btn-primary" id="openExploreForm">＋ 新增待嘗試資源</button>

      <div class="duck-form hidden card" id="exploreForm">
        <div class="duck-form-header">
          <h3>新增待嘗試資源</h3>
          <button id="closeExploreForm">✕</button>
        </div>
        <label>分類
          <div class="chip-select" id="exploreCategoryChips"></div>
        </label>
        <label>名稱
          <input id="exploreName" placeholder="例如：某某 Podcast、某口說課程" />
        </label>
        <label>備註
          <textarea id="exploreNote" rows="2" placeholder="例如：朋友推薦，還沒試聽"></textarea>
        </label>
        <div class="duck-form-actions">
          <button class="btn-primary" id="submitExplore">加入清單</button>
          <button class="btn-ghost" id="cancelExplore">取消</button>
        </div>
      </div>

      <div class="explore-list" id="exploreList"></div>
    </section>

  </main>
</div>

<script>
// ==================== VOCAB BANK (TOEIC core, ~160 words) ====================
const VOCAB_BANK = [
  {w:"agenda",pos:"n.",m:"議程；待辦事項",ex:"Please review the agenda before tomorrow's meeting.",exz:"請在明天開會前先看過議程。"},
  {w:"amenities",pos:"n.",m:"（飯店等的）設施",ex:"The hotel offers amenities such as a gym and a pool.",exz:"這間飯店提供健身房和泳池等設施。"},
  {w:"appliance",pos:"n.",m:"家電用品",ex:"The store sells a wide range of kitchen appliances.",exz:"這家店販售各種廚房家電。"},
  {w:"applicant",pos:"n.",m:"申請人；求職者",ex:"Each applicant must submit a resume and cover letter.",exz:"每位申請人都必須繳交履歷與求職信。"},
  {w:"appraisal",pos:"n.",m:"評估；估價",ex:"The manager conducts a performance appraisal every year.",exz:"經理每年都會進行績效評估。"},
  {w:"approve",pos:"v.",m:"批准；核准",ex:"The board approved the new budget proposal.",exz:"董事會批准了新的預算提案。"},
  {w:"asset",pos:"n.",m:"資產；有價值的人事物",ex:"Good communication skills are a valuable asset in this job.",exz:"良好的溝通能力在這份工作中是寶貴的資產。"},
  {w:"attain",pos:"v.",m:"達成；獲得",ex:"The team worked hard to attain its sales target.",exz:"團隊努力達成銷售目標。"},
  {w:"audit",pos:"n./v.",m:"稽核；審計",ex:"An external firm will audit the company's finances.",exz:"一家外部公司將審計這家公司的財務。"},
  {w:"beneficial",pos:"adj.",m:"有益的",ex:"Regular exercise is beneficial to your health.",exz:"規律運動有益健康。"},
  {w:"boost",pos:"v.",m:"提升；促進",ex:"The new campaign helped boost sales significantly.",exz:"新的宣傳活動大幅提升了銷售額。"},
  {w:"brochure",pos:"n.",m:"小冊子；宣傳手冊",ex:"You can find more details in our product brochure.",exz:"你可以在我們的產品手冊中找到更多細節。"},
  {w:"budget",pos:"n.",m:"預算",ex:"We need to stay within the marketing budget.",exz:"我們必須控制在行銷預算之內。"},
  {w:"candidate",pos:"n.",m:"候選人",ex:"Three candidates were shortlisted for the position.",exz:"有三位候選人進入了這個職位的最終名單。"},
  {w:"clarify",pos:"v.",m:"澄清；說明",ex:"Could you clarify what you meant by that comment?",exz:"你能澄清一下那個評論的意思嗎？"},
  {w:"collaborate",pos:"v.",m:"合作",ex:"The two departments collaborated on the new project.",exz:"這兩個部門合作完成了這項新專案。"},
  {w:"commence",pos:"v.",m:"開始",ex:"The construction work will commence next Monday.",exz:"施工工程將於下週一開始。"},
  {w:"commodity",pos:"n.",m:"商品；日用品",ex:"Coffee is one of the most traded commodities in the world.",exz:"咖啡是世界上交易量最大的商品之一。"},
  {w:"compensate",pos:"v.",m:"補償",ex:"The airline offered to compensate passengers for the delay.",exz:"航空公司提出要補償乘客延誤的損失。"},
  {w:"compile",pos:"v.",m:"彙編；整理",ex:"She compiled all the survey results into one report.",exz:"她把所有的調查結果彙整成一份報告。"},
  {w:"comply",pos:"v.",m:"遵守；符合",ex:"All employees must comply with the safety regulations.",exz:"所有員工都必須遵守安全規定。"},
  {w:"consecutive",pos:"adj.",m:"連續的",ex:"This is the third consecutive year of profit growth.",exz:"這是連續第三年獲利成長。"},
  {w:"consent",pos:"n./v.",m:"同意；許可",ex:"The doctor needs your consent before the procedure.",exz:"醫生在進行手術前需要你的同意。"},
  {w:"consult",pos:"v.",m:"諮詢；請教",ex:"Please consult the manual before installing the software.",exz:"安裝軟體前請先查閱手冊。"},
  {w:"contractor",pos:"n.",m:"承包商",ex:"The company hired a contractor to renovate the office.",exz:"公司聘請了一家承包商來翻修辦公室。"},
  {w:"contribute",pos:"v.",m:"貢獻；捐助",ex:"Every team member contributed to the project's success.",exz:"每位團隊成員都為專案的成功做出了貢獻。"},
  {w:"convene",pos:"v.",m:"召集；集會",ex:"The committee will convene to discuss the proposal.",exz:"委員會將召開會議討論這項提案。"},
  {w:"corporate",pos:"adj.",m:"公司的；企業的",ex:"The corporate headquarters is located downtown.",exz:"公司總部位於市中心。"},

const todayStr = () => new Date().toISOString().slice(0, 10);
const daysAgoStr = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
const dateDiffDays = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const uid = () => Math.random().toString(36).slice(2, 10);
const escapeHtml = (str) => { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; };

function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

  const line = filled ? '#6E8449' : '#C9BE9F';
  return `<div class="lily-wrap">
    <svg width="36" height="36" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="13" stroke="${line}" stroke-opacity="0.5" fill="none" />
      <path d="M18 20 C10 20 6 15 8 8 C14 6 22 8 26 14 C28 20 24 24 18 20 Z" fill="${fill}" stroke="${line}" stroke-width="1.2"/>
      <path d="M18 20 L26 12" stroke="${line}" stroke-width="1.2" fill="none"/>
    </svg>
    ${isToday ? `<div class="lily-duck">${duckSvg(28)}</div>` : ''}
  </div>`;
}

// ==================== storage ====================
function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { console.error('load error', key, e); return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.error('save error', key, e); document.getElementById('saveWarning').style.display = 'block'; return false; }
}

const DEFAULT_GOALS = { listening: 90, speaking: 60, reading: 60, vocab: 30, toeicScore: 800, toeicDate: "" };

let state = {
  entries: loadJSON('duckEntries', []),
  exploreItems: loadJSON('duckExploreItems', []),
  goals: Object.assign({}, DEFAULT_GOALS, loadJSON('duckGoals', {}))
};

let skillChartInstance = null;
let trendChartInstance = null;
let selectedEntrySkills = [];
let selectedExploreCategory = 'listening';

// ==================== stats ====================
function computeStats(entries) {
  const today = todayStr();
  const weekStart = daysAgoStr(6);
  const prevWeekStart = daysAgoStr(13);
  const prevWeekEnd = daysAgoStr(7);

  const thisWeek = entries.filter(e => e.date >= weekStart && e.date <= today);
  const lastWeek = entries.filter(e => e.date >= prevWeekStart && e.date <= prevWeekEnd);
  const sumMinutes = (list) => list.reduce((s, e) => s + Number(e.minutes || 0), 0);
  const totalThisWeek = sumMinutes(thisWeek);
  const totalLastWeek = sumMinutes(lastWeek);

  const skillMinutesWeek = {};
  SKILL_KEYS.forEach(k => skillMinutesWeek[k] = 0);
  thisWeek.forEach(e => {
    const list = e.skills && e.skills.length ? e.skills : [];
    const share = list.length ? Number(e.minutes || 0) / list.length : 0;
    list.forEach(k => { if (skillMinutesWeek[k] !== undefined) skillMinutesWeek[k] += share; });
  });

  const lastPracticed = {};
  SKILL_KEYS.forEach(k => {
    const withSkill = entries.filter(e => e.skills && e.skills.includes(k));
    if (withSkill.length) lastPracticed[k] = withSkill.reduce((latest, e) => e.date > latest ? e.date : latest, withSkill[0].date);
  });

  const dateSet = new Set(entries.map(e => e.date));
  let streak = 0;
  let cursor = today;
  if (!dateSet.has(today)) cursor = daysAgoStr(1);
  while (dateSet.has(cursor)) {
    streak += 1;
    const d = new Date(cursor); d.setDate(d.getDate() - 1);
    cursor = d.toISOString().slice(0, 10);
  }

  const pond = [];
  for (let i = 13; i >= 0; i--) { const d = daysAgoStr(i); pond.push({ date: d, filled: dateSet.has(d), isToday: d === today }); }

  const dailyTrend = [];
  for (let i = 13; i >= 0; i--) { const d = daysAgoStr(i); const mins = sumMinutes(entries.filter(e => e.date === d)); dailyTrend.push({ date: d.slice(5), minutes: Math.round(mins) }); }

  const totalVocab = entries.reduce((s, e) => s + Number(e.vocabCount || 0), 0);
  const vocabThisWeek = thisWeek.reduce((s, e) => s + Number(e.vocabCount || 0), 0);
  const vocabLastWeek = lastWeek.reduce((s, e) => s + Number(e.vocabCount || 0), 0);

  return { totalThisWeek, totalLastWeek, skillMinutesWeek, lastPracticed, streak, pond, dailyTrend, today, totalVocab, vocabThisWeek, vocabLastWeek };
}

function computeSuggestions(entries, stats, goals) {
  const out = [];
  if (entries.length === 0) return ["歡迎！先從一筆學習紀錄開始吧，哪怕只有 10 分鐘也算數。"];

  GOAL_SKILL_KEYS.forEach(k => {
    const last = stats.lastPracticed[k];
    if (last) {
      const idle = dateDiffDays(last, stats.today);
      if (idle >= 7) out.push(`已經 ${idle} 天沒練習「${SKILLS[k].label}」了，安排一次複習吧。`);
    }
  });

  if (stats.totalLastWeek > 0) {
    const change = (stats.totalThisWeek - stats.totalLastWeek) / stats.totalLastWeek;
    if (change <= -0.3) out.push(`本週學習時數比上週少了約 ${Math.round(Math.abs(change) * 100)}%，要不要抓回一點節奏？`);
    else if (change >= 0.3) out.push(`本週學習時數比上週多了約 ${Math.round(change * 100)}%，保持得很好！`);
  }

  const weekTotal = Object.values(stats.skillMinutesWeek).reduce((a, b) => a + b, 0);
  if (weekTotal > 0) {
    GOAL_SKILL_KEYS.forEach(k => {
      const ratio = stats.skillMinutesWeek[k] / weekTotal;
      if (ratio >= 0.6) out.push(`「${SKILLS[k].label}」佔本週練習比例偏高，可以分一些時間給其他技能。`);
    });
  }

  GOAL_SKILL_KEYS.forEach(k => {
    const goal = Number(goals[k] || 0);
    if (goal > 0) {
      const actual = stats.skillMinutesWeek[k];
      if (actual < goal * 0.5) out.push(`「${SKILLS[k].label}」本週只完成目標的 ${Math.round((actual / goal) * 100)}%，還有機會追上。`);
    }
  });

  if (goals.toeicDate) {
    const days = dateDiffDays(stats.today, goals.toeicDate);
    if (days >= 0 && days <= 14) {
      const toeicMinutes = stats.skillMinutesWeek.toeic || 0;
      if (toeicMinutes < 60) out.push(`距離多益考試剩下 ${days} 天，本週的準備時間還不多，抓緊時間衝刺一下。`);
    }
  }

  if (stats.streak === 0 && entries.length > 0) out.push("已經有一陣子沒打卡了，今天重新開始也沒關係。");
  if (out.length === 0) out.push("目前的節奏很平均，繼續保持。");
  return out;
}

// ==================== render ====================
function render() {
  const { entries, exploreItems, goals } = state;
  const stats = computeStats(entries);
  const suggestions = computeSuggestions(entries, stats, goals);

  document.getElementById('mascotHeader').innerHTML = duckSvg(46);
  document.getElementById('streakText').textContent = `連續學習 ${stats.streak} 天`;
  document.getElementById('pondRow').innerHTML = stats.pond.map(p => lilySvg(p.filled, p.isToday)).join('');
  document.getElementById('statWeekMinutes').textContent = Math.round(stats.totalThisWeek);
  document.getElementById('statEntryCount').textContent = entries.length;
  document.getElementById('statVocabCount').textContent = stats.totalVocab;
  document.getElementById('suggestList').innerHTML = suggestions.map(s => `<li>${escapeHtml(s)}</li>`).join('');

  renderWordCard();
  renderGoalBars(stats, goals);
  renderToeicCard(stats, goals);
  renderCharts(stats);
  renderEntryList(entries);
  renderExploreList(exploreItems);
}

function renderWordCard() {
  const idx = dayOfYear(new Date()) % VOCAB_BANK.length;
  const w = VOCAB_BANK[idx];
  document.getElementById('wordCard').innerHTML = `
    <div class="word-main">
      <div class="word-eyebrow">今日單字</div>
      <div class="word-title">${escapeHtml(w.w)}</div>
      <span class="word-pos">${escapeHtml(w.pos)}</span><span class="word-meaning">${escapeHtml(w.m)}</span>
      <p class="word-example">“${escapeHtml(w.ex)}”</p>
      <p class="word-example-zh">${escapeHtml(w.exz)}</p>
    </div>
  `;
}

function renderGoalBars(stats, goals) {
  const el = document.getElementById('goalBars');
  el.innerHTML = GOAL_SKILL_KEYS.map(k => {
    const goal = Number(goals[k] || 0);
    const actual = Math.round(stats.skillMinutesWeek[k]);
    const pct = goal > 0 ? Math.min(100, Math.round((actual / goal) * 100)) : 0;
    return `
      <div class="goal-row">
        <span class="goal-label">${SKILLS[k].label}</span>
        <div class="goal-track"><div class="goal-fill" style="width:${pct}%; background:${SKILLS[k].color}"></div></div>
        <span class="goal-value">${actual} / ${goal || '—'} 分</span>
      </div>
    `;
  }).join('');
}

function renderToeicCard(stats, goals) {
  const el = document.getElementById('toeicCard');
  let daysHtml = '';
  if (goals.toeicDate) {
    const days = dateDiffDays(stats.today, goals.toeicDate);
    daysHtml = `<div class="toeic-days">${days >= 0 ? days : 0}</div><div class="toeic-days-label">${days >= 0 ? '天後應考' : '考試日已過'}</div>`;
  } else {
    daysHtml = `<div class="toeic-days-label">尚未設定應考日期</div>`;
  }
  const toeicMinutes = Math.round(stats.skillMinutesWeek.toeic || 0);
  el.innerHTML = `
    <div class="toeic-left">
      <h3>多益備考</h3>
      <p>目標分數：${goals.toeicScore || '—'} 分</p>
      <p>本週準備時間：${toeicMinutes} 分鐘</p>
    </div>
    <div class="toeic-right">${daysHtml}</div>
  `;
}

function renderCharts(stats) {
  const skillLabels = SKILL_KEYS.map(k => SKILLS[k].label);
  const skillData = SKILL_KEYS.map(k => Math.round(stats.skillMinutesWeek[k]));
  const skillColors = SKILL_KEYS.map(k => SKILLS[k].color);

  const skillCtx = document.getElementById('skillChart');
  if (skillChartInstance) skillChartInstance.destroy();
  skillChartInstance = new Chart(skillCtx, {
    type: 'bar',
    data: { labels: skillLabels, datasets: [{ data: skillData, backgroundColor: skillColors, borderRadius: 8 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { font: { family: 'Work Sans' } } } } }
  });

  const trendCtx = document.getElementById('trendChart');
  if (trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(trendCtx, {
    type: 'line',
    data: { labels: stats.dailyTrend.map(d => d.date), datasets: [{ data: stats.dailyTrend.map(d => d.minutes), borderColor: '#BE6248', backgroundColor: 'rgba(190,98,72,0.12)', fill: true, tension: 0.35, pointBackgroundColor: '#BE6248' }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { font: { family: 'Work Sans' } } } } }
  });
}

function renderEntryList(entries) {
  const el = document.getElementById('entryList');
  if (entries.length === 0) { el.innerHTML = '<p class="empty-hint">還沒有紀錄，開始寫下今天學了什麼吧。</p>'; return; }
  const sorted = entries.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  el.innerHTML = sorted.map(e => `
    <div class="card entry-item" data-id="${e.id}">
      <div class="entry-item-top">
        <span class="entry-date">${e.date}</span>
        <span class="entry-minutes">${e.minutes} 分鐘</span>
        <button class="entry-delete" data-action="delete-entry" data-id="${e.id}">🗑</button>
      </div>
      <div class="entry-skills">
        ${(e.skills || []).map(k => `<span class="skill-chip" style="background:${SKILLS[k].color}">${SKILLS[k].label}</span>`).join('')}
      </div>
      ${e.vocabCount ? `<p class="entry-vocab">背了 ${e.vocabCount} 個單字</p>` : ''}
      ${e.note ? `<p class="entry-note">${escapeHtml(e.note)}</p>` : ''}
    </div>
  `).join('');
}

function renderExploreList(items) {
  const el = document.getElementById('exploreList');
  if (items.length === 0) { el.innerHTML = '<p class="empty-hint">目前沒有探索中的項目。</p>'; return; }
  el.innerHTML = items.map(item => `
    <div class="card explore-item" data-id="${item.id}">
      <div class="explore-item-top">
        <span class="skill-chip" style="background:${(SKILLS[item.category] || {}).color || '#B9C6C0'}">${(SKILLS[item.category] || {}).label || '其他'}</span>
        <button class="entry-delete" data-action="delete-explore" data-id="${item.id}">🗑</button>
      </div>
      <h4>${escapeHtml(item.name)}</h4>
      ${item.note ? `<p>${escapeHtml(item.note)}</p>` : ''}
    </div>
  `).join('');
}

function renderChipSelect(containerId, mode) {
  const el = document.getElementById(containerId);
  el.innerHTML = SKILL_KEYS.map(k => {
    const selected = mode === 'multi' ? selectedEntrySkills.includes(k) : selectedExploreCategory === k;
    return `<button type="button" class="chip-option${selected ? ' selected' : ''}" data-key="${k}" style="${selected ? `background:${SKILLS[k].color};border-color:${SKILLS[k].color}` : ''}">${SKILLS[k].label}</button>`;
  }).join('');
}

// ==================== tabs ====================
document.querySelectorAll('.duck-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.duck-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ==================== entry form ====================
document.getElementById('openEntryForm').addEventListener('click', () => {
  selectedEntrySkills = [];
  document.getElementById('entryDate').value = todayStr();
  document.getElementById('entryDate').max = todayStr();
  document.getElementById('entryMinutes').value = 20;
  document.getElementById('entryVocabCount').value = 0;
  document.getElementById('vocabCountWrap').style.display = 'none';
  document.getElementById('entryNote').value = '';
  document.getElementById('entryHint').style.display = 'none';
  renderChipSelect('entrySkillChips', 'multi');
  document.getElementById('entryForm').classList.remove('hidden');
});
document.getElementById('closeEntryForm').addEventListener('click', () => document.getElementById('entryForm').classList.add('hidden'));
document.getElementById('cancelEntry').addEventListener('click', () => document.getElementById('entryForm').classList.add('hidden'));

document.getElementById('entrySkillChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip-option');
  if (!btn) return;
  const k = btn.dataset.key;
  const idx = selectedEntrySkills.indexOf(k);
  if (idx >= 0) selectedEntrySkills.splice(idx, 1); else selectedEntrySkills.push(k);
  renderChipSelect('entrySkillChips', 'multi');
  document.getElementById('vocabCountWrap').style.display = selectedEntrySkills.includes('vocab') ? 'flex' : 'none';
});

document.getElementById('submitEntry').addEventListener('click', () => {
  if (selectedEntrySkills.length === 0) { document.getElementById('entryHint').style.display = 'block'; return; }
  const entry = {
    id: uid(),
    date: document.getElementById('entryDate').value || todayStr(),
    skills: [...selectedEntrySkills],
    minutes: Number(document.getElementById('entryMinutes').value) || 0,
    vocabCount: selectedEntrySkills.includes('vocab') ? (Number(document.getElementById('entryVocabCount').value) || 0) : 0,
    note: document.getElementById('entryNote').value.trim()
  };
  state.entries = [entry, ...state.entries];
  saveJSON('duckEntries', state.entries);
  document.getElementById('entryForm').classList.add('hidden');
  render();
});

document.getElementById('entryList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="delete-entry"]');
  if (!btn) return;
  state.entries = state.entries.filter(x => x.id !== btn.dataset.id);
  saveJSON('duckEntries', state.entries);
  render();
});

// ==================== explore form ====================
document.getElementById('openExploreForm').addEventListener('click', () => {
  selectedExploreCategory = 'listening';
  document.getElementById('exploreName').value = '';
  document.getElementById('exploreNote').value = '';
  renderChipSelect('exploreCategoryChips', 'single');
  document.getElementById('exploreForm').classList.remove('hidden');
});
document.getElementById('closeExploreForm').addEventListener('click', () => document.getElementById('exploreForm').classList.add('hidden'));
document.getElementById('cancelExplore').addEventListener('click', () => document.getElementById('exploreForm').classList.add('hidden'));

document.getElementById('exploreCategoryChips').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip-option');
  if (!btn) return;
  selectedExploreCategory = btn.dataset.key;
  renderChipSelect('exploreCategoryChips', 'single');
});

document.getElementById('submitExplore').addEventListener('click', () => {
  const name = document.getElementById('exploreName').value.trim();
  if (!name) return;
  const item = { id: uid(), category: selectedExploreCategory, name, note: document.getElementById('exploreNote').value.trim() };
  state.exploreItems = [item, ...state.exploreItems];
  saveJSON('duckExploreItems', state.exploreItems);
  document.getElementById('exploreForm').classList.add('hidden');
  render();
});

document.getElementById('exploreList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="delete-explore"]');
  if (!btn) return;
  state.exploreItems = state.exploreItems.filter(x => x.id !== btn.dataset.id);
  saveJSON('duckExploreItems', state.exploreItems);
  render();
});

// ==================== goal form ====================
function buildGoalFormFields() {
  const el = document.getElementById('goalFormFields');
  el.innerHTML = GOAL_SKILL_KEYS.map(k => `
    <label>${SKILLS[k].label}週目標（分鐘）
      <input type="number" min="0" step="10" id="goalInput_${k}" value="${state.goals[k] || 0}" />
    </label>
  `).join('');
}

document.getElementById('openGoalForm').addEventListener('click', () => {
  buildGoalFormFields();
  document.getElementById('goalToeicScore').value = state.goals.toeicScore || '';
  document.getElementById('goalToeicDate').value = state.goals.toeicDate || '';
  document.getElementById('goalForm').classList.remove('hidden');
});
document.getElementById('closeGoalForm').addEventListener('click', () => document.getElementById('goalForm').classList.add('hidden'));
document.getElementById('cancelGoals').addEventListener('click', () => document.getElementById('goalForm').classList.add('hidden'));

document.getElementById('submitGoals').addEventListener('click', () => {
  const newGoals = { ...state.goals };
  GOAL_SKILL_KEYS.forEach(k => { newGoals[k] = Number(document.getElementById(`goalInput_${k}`).value) || 0; });
  newGoals.toeicScore = Number(document.getElementById('goalToeicScore').value) || 0;
  newGoals.toeicDate = document.getElementById('goalToeicDate').value || "";
  state.goals = newGoals;
  saveJSON('duckGoals', state.goals);
  document.getElementById('goalForm').classList.add('hidden');
  render();
});

// ==================== init ====================
render();
</script>
</body>
